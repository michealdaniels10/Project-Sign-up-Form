<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font for ODIN text -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

    <script src="script.js" defer></script>
</head>

<body>

    <div class="sidebar">

        <div class="logo-container">

            <img src="images/odin-lined.png" width="500" alt="Odin Logo">

            <h1>ODIN</h1>

        </div>

        <p class="credit">
            Photo by <a
                href="https://unsplash.com/@filipz?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Filip
                Zrnzević</a> on <a
                href="https://unsplash.com/photos/aerial-photography-of-forest-QsWG0kjPQRY?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
        </p>

    </div>

    <div class="main-content">

        <div class="intro">

            <p>
                This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
            </p>

            <p>
                Sign up now to get started.
            </p>

            <p>
                You know you want to.
            </p>

        </div>

        <div class="form-section">

            <h2>Let's do this!</h2>

            <form action="#">

                <div class="form-row">

                    <div class="input-group">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" required>
                    </div>

                    <div class="input-group">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" required>
                    </div>

                </div>

                <div class="form-row">

                    <div class="input-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="input-group">
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone">
                    </div>

                </div>

                <div class="form-row">

                    <div class="input-group">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" minlength="8" required>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" minlength="8" required>
                    </div>

                </div>

            </form>

        </div>

        <div class="submit-section">

            <button>Create Account</button>

            <p>
                Already have an account?
                <a href="#">Log in</a>
            </p>

        </div>

    </div>

</body>

</html>
